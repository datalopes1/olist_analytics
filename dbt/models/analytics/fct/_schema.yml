version: 2

models:
  - name: fct_deliveries
    description: "Tabela fato com pedidos e dados de entrega."

    columns:
      - name: delivery_sk
        tests:
          - not_null
          - unique

      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk

      - name: geolocation_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_geolocations')
                field: geolocation_sk
    
  - name: fct_sales
    description: "Tabela fato com os detalhes do pedido."

    columns:
      - name: order_sk
        tests:
          - unique
          - not_null
      
      - name: customer_sk
        tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
      
      - name: product_sk
        tests: 
          - not_null
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_sk
      
      - name: seller_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_sk

  - name: fct_payments
    description: "Tabela fato com dados de pagamento."

    columns:
      - name: payment_sk
        tests:
          - unique
          - not_null
      - name: customer_sk
        tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk
  
  - name: fct_reviews
    description: "Tabela fato com as notas de avaliação."

    columns:
      - name: review_sk
        tests:
          - unique
          - not_null
      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk