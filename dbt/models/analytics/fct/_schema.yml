version: 2

models:
  - name: fct_sales
    description: "Tabela fato com métricas de vendas."

    columns:
      - name: sales_sk
        tests:
          - not_null
          - unique

      - name: product_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_sk

      - name: seller_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_sellers')
                field: seller_sk

      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk

      - name: geolocation_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_geolocations')
                field: geolocation_sk

  - name: fct_deliveries
    description: "Tabela fato com métricas de entrega."

    columns:
      - name: order_id
        tests: 
          - unique
          - not_null

      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk

      - name: geolocation_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_geolocations')
                field: geolocation_sk

  - name: fct_payments
    description: "Tabela fato com dados de pagamentos."

    columns:
      - name: payment_sk
        tests:
          - not_null
          - unique

      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk

  - name: fct_reviews
    description: "Tabela fato com dados de avaliações."

    columns:
      - name: review_sk
        tests:
          - not_null
          - unique

      - name: customer_sk
        tests:
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_sk