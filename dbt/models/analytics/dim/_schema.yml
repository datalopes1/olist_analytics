version: 2

models:
  - name: dim_customers
    description: "Dimensão com cada cliente único."

    columns:
      - name: customer_sk
        tests:
          - not_null
          - unique
      
  - name: dim_geolocations
    description: "Dimensão com dados de geolocalização"

    columns:
      - name: geolocation_sk
        tests:
          - not_null
          - unique

  - name: dim_products
    description: "Dimensão com os produtos e suas categorias."

    columns:
      - name: product_sk
        tests:
          - not_null
          - unique

  - name: dim_sellers
    description: "Dimensão com cada vendedor único."

    columns:
      - name: seller_sk
        tests:
          - not_null
          - unique