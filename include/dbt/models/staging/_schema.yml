version: 2

models:
  - name: stg_orders
    description: "Model de staging para padronizar e tipar as datas e status da tabela de pedidos."
    columns:
      - name: order_id
        description: "Chave primária única de cada pedido."
        tests:
          - unique
          - not_null

      - name: customer_id
        description: "ID do cliente associado ao pedido."
        tests:
          - not_null

      - name: order_status
        description: "Status do pedido em caixa alta (ex: DELIVERED, SHIPPED)."
        tests:
          - accepted_values:
              values: ['DELIVERED', 'SHIPPED', 'CANCELED', 'UNAVAILABLE', 'INVOICED', 'PROCESSING', 'CREATED', 'APPROVED']

      - name: purchase_ts
        description: "Timestamp de realização da compra convertido para DATETIME."
        tests:
          - not_null

      - name: approved_at
        description: "Timestamp de aprovação do pagamento convertido para DATETIME."

      - name: estimated_delivery_dt
        description: "Data/hora estimada para entrega convertida para DATETIME."

      - name: delivered_carrier_dt
        description: "Data/hora de despacho para a transportadora convertida para DATETIME."

      - name: delivered_customer_dt
        description: "Data/hora real da entrega ao cliente convertida para DATETIME."