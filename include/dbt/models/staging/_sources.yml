version: 2

sources:
  - name: raw
    database: my_database  # Substitua pelo nome do seu banco de dados, se aplicável
    schema: raw
    description: "Dados brutos do e-commerce Olist armazenados no schema raw."
    tables:
      - name: orders
        description: "Tabela contendo os pedidos realizados na plataforma."
        columns:
          - name: order_id
            description: "Chave primária do pedido."
            tests:
              - unique
              - not_null
          - name: customer_id
            description: "Chave estrangeira para o cliente."
            tests:
              - not_null
          - name: order_status
            description: "Status atual do pedido (ex: delivered, shipped, canceled)."
          - name: order_purchase_timestamp
            description: "Data e hora em que o pedido foi realizado."
          - name: order_approved_at
            description: "Data e hora do pagamento aprovado."
          - name: order_delivered_carrier_date
            description: "Data e hora em que o pedido foi despachado para a transportadora."
          - name: order_delivered_customer_date
            description: "Data e hora da entrega ao cliente."
          - name: order_estimated_delivery_date
            description: "Data estimada para entrega ao cliente."